name: concert-tickets

x-node-env: &node-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
  PAYMENT_CHAOS: ${PAYMENT_CHAOS}
  PAYMENT_STUB_RPS: ${PAYMENT_STUB_RPS}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  MAIL_FROM: ${MAIL_FROM}
  ENABLE_TEST_CONTROLS: ${ENABLE_TEST_CONTROLS}
  QUEUE_MAX_SELECTORS: ${QUEUE_MAX_SELECTORS}
  QUEUE_TRIGGER_THRESHOLD: ${QUEUE_TRIGGER_THRESHOLD}
  SEED_PASSWORD: ${SEED_PASSWORD}

x-api: &api
  build:
    context: .
    dockerfile: docker/node.Dockerfile
    args: { APP: api }
  image: tickets-api
  environment: &api-env
    <<: *node-env
    PORT: '3000'
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 30
    ports: ['${POSTGRES_HOST_PORT:-5432}:5432']

  redis:
    image: redis:7
    # Redis holds only queues/caches; app state survives FLUSHALL / restart (no persistence on purpose).
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    ports: ['6379:6379']

  mailstub:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: mailstub }
    image: tickets-mailstub
    environment:
      SMTP_PORT: '1025'
      HTTP_PORT: '8025'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8025/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ['8025:8025', '1025:1025']
    restart: unless-stopped

  # One-shot: applies migrations + idempotent seed, then exits. api/worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: migrate }
    image: tickets-migrate
    command: ['node', 'dist/main.js', '--seed']
    environment:
      <<: *node-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api1
    ports: ['3001:3000']

  api2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api2
    ports: ['3002:3000']

  worker:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { APP: worker }
    image: tickets-worker
    environment:
      <<: *node-env
      PORT: '3100'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailstub: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: tickets-web
    environment:
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    volumes: ['./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/nginx-health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ['8080:80']
    restart: unless-stopped

volumes:
  pgdata:
